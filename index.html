const GLITCH_CHARS = "#$%&01_/\\^~<>";
 
/* ---------------- CANVAS ---------------- */
const canvas = document.getElementById('glCanvas');
const ctx = canvas.getContext('2d');
let W = canvas.width, H = canvas.height;
let cachedFrames = {};
 
function resize(){
  W = canvas.width = window.innerWidth;
  H = canvas.height = window.innerHeight;
  cachedFrames = {};
}
window.addEventListener('resize', resize);
resize();
 
const loaded = [];
let sourcesReady = false;

// IMAGE LOADING FIX APPLIED HERE
Promise.all(IMAGES.map(src => new Promise(res => {
  const img = new Image();
  img.onload = () => res(img);
  img.onerror = () => {
    console.warn("Could not load image, skipping:", src);
    res(null); // Resolves anyway so the site doesn't freeze
  };
  img.src = src;
}))).then(imgs => {
  // Filter out any images that failed to load
  const successfulImages = imgs.filter(img => img !== null);
  
  if (successfulImages.length > 0) {
    loaded.push(...successfulImages);
    sourcesReady = true;
    requestAnimationFrame(loop);
  } else {
    console.error("No images loaded successfully. Check your file paths.");
  }
});
 
function linesOf(poemText){
  return poemText.split('\n').map(l => l.trim()).filter(l => l.length > 0);
}
 
function getFrameData(img){
  const off = document.createElement('canvas');
  off.width = W; off.height = H;
  const octx = off.getContext('2d');
  const scale = Math.max(W / img.width, H / img.height);
  const dw = img.width * scale, dh = img.height * scale;
  octx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh);
  return octx.getImageData(0, 0, W, H);
}
 
let position = Math.floor(Math.random() * IMAGES.length);
let velocity = 0;
let currentIndex = position;
let currentPoemIndex = 0;
 
function pickRandomPoemIndex(){
  if(POEMS.length <= 1) return 0;
  let idx;
  do { idx = rand(POEMS.length); } while (idx === currentPoemIndex);
  return idx;
}
 
function frameFor(i){
  const n = loaded.length;
  const idx = ((i % n) + n) % n;
  if(!cachedFrames[idx]) cachedFrames[idx] = getFrameData(loaded[idx]);
  return cachedFrames[idx];
}
 
let mode = 'band';
let modeArmed = true;
let bandOffset = [], bandTarget = [];
 
function armNewTransition(){
  const modes = ['band','vertical','block','flash'];
  mode = modes[Math.floor(Math.random()*modes.length)];
  const bandCount = 8 + Math.floor(Math.random()*32);
  bandOffset = new Array(bandCount).fill(0);
  bandTarget = new Array(bandCount).fill(0);
}
 
let lastInputTime = performance.now();
 
window.addEventListener('wheel', e => {
  velocity += e.deltaY * 0.0016;
  lastInputTime = performance.now();
}, {passive:true});
 
let touchStartY = null;
window.addEventListener('touchstart', e => { touchStartY = e.touches[0].clientY; lastInputTime = performance.now(); }, {passive:true});
window.addEventListener('touchmove', e => {
  if(touchStartY === null) return;
  const dy = touchStartY - e.touches[0].clientY;
  velocity += dy * 0.008;
  touchStartY = e.touches[0].clientY;
  lastInputTime = performance.now();
}, {passive:true});
 
/* ---------------- ADAPTIVE TEXT COLOR ---------------- */
const termText = document.getElementById('termText');
let bgIsLight = true;
function sampleBgLuminance(imgData){
  const data = imgData.data;
  const bandStart = Math.floor(H*0.74);
  let total=0, count=0;
  for(let y=bandStart; y<H; y+=7){
    for(let x=0; x<W; x+=7){
      const idx=(y*W+x)*4;
      total += 0.299*data[idx]+0.587*data[idx+1]+0.114*data[idx+2];
      count++;
    }
  }
  return count ? total/count : 128;
}
function applyTextColor(imgData){
  const lum = sampleBgLuminance(imgData);
  if(lum > 150 && !bgIsLight) bgIsLight = true;
  else if(lum < 100 && bgIsLight) bgIsLight = false;
  termText.classList.toggle('on-light', bgIsLight);
  termText.classList.toggle('on-dark', !bgIsLight);
}
 
/* ---------------- STILLNESS / READING MODE ---------------- */
const textzone = document.getElementById('textzone');
const holdPanel = document.getElementById('holdPanel');
const holdIndicator = document.getElementById('holdIndicator');
const holdPoemText = document.getElementById('holdPoemText');
const hintText = document.getElementById('hintText');
let holding = false;
const STILL_THRESHOLD_MS = 7000; // how long to stay still before the full poem appears
 
function enterHold(){
  if(holding) return;
  holding = true;
  holdPoemText.textContent = POEMS[currentPoemIndex];
  holdPanel.classList.add('visible');
  holdIndicator.classList.remove('visible');
  textzone.classList.add('hidden');
  hintText.style.opacity = 0;
}
function exitHold(){
  if(!holding) return;
  holding = false;
  holdPanel.classList.remove('visible');
  textzone.classList.remove('hidden');
  hintText.style.opacity = '';
}
 
function loop(){
  if(!sourcesReady){ requestAnimationFrame(loop); return; }
 
  position += velocity;
  velocity *= 0.9;
 
  const nearest = Math.round(position);
  const dist = Math.abs(position - nearest);
  const energy = Math.min(1, dist * 2.15);
 
  if(Math.abs(velocity) < 0.004){
    position += (nearest - position) * 0.12;
  }
 
  const newIndex = ((nearest % loaded.length) + loaded.length) % loaded.length;
  if(newIndex !== currentIndex){
    currentIndex = newIndex;
    currentPoemIndex = pickRandomPoemIndex();
    if(!holding) triggerNewFragment();
    exitHold();
  }
 
  if(energy > 0.04 && modeArmed){ armNewTransition(); modeArmed = false; }
  if(energy < 0.03) modeArmed = true;
 
  const src = frameFor(nearest);
  applyTextColor(src);
 
  // stillness detection — only while fully settled
  const stillFor = performance.now() - lastInputTime;
  if(energy < 0.01 && Math.abs(velocity) < 0.0005){
    if(!holding && stillFor > STILL_THRESHOLD_MS){
      enterHold();
    } else if(!holding && stillFor > STILL_THRESHOLD_MS * 0.3){
      holdIndicator.classList.add('visible');
    }
  } else {
    holdIndicator.classList.remove('visible');
    if(holding) exitHold();
  }
 
  if(energy < 0.02){
    ctx.putImageData(src, 0, 0);
    requestAnimationFrame(loop);
    return;
  }
 
  const out = ctx.createImageData(W, H);
  const s = src.data, d = out.data;
  const rgbShift = Math.round(4 + energy * 22);
 
  if(mode === 'band'){
    const BANDS = bandOffset.length;
    const bandH = H / BANDS;
    for(let b=0;b<BANDS;b++){
      if(Math.random() < 0.3) bandTarget[b] = (Math.random()*2-1) * energy * 70;
      bandOffset[b] += (bandTarget[b] - bandOffset[b]) * 0.5;
    }
    for(let y=0;y<H;y++){
      const band = Math.min(BANDS-1, Math.floor(y/bandH));
      const off = Math.round(bandOffset[band]);
      for(let x=0;x<W;x++){
        const sx = clampi(x - off, 0, W-1);
        writePixel(d, s, x, y, sx, y, rgbShift, W);
      }
    }
  } else if(mode === 'vertical'){
    const BANDS = bandOffset.length;
    const bandW = W / BANDS;
    for(let b=0;b<BANDS;b++){
      if(Math.random() < 0.3) bandTarget[b] = (Math.random()*2-1) * energy * 90;
      bandOffset[b] += (bandTarget[b] - bandOffset[b]) * 0.5;
    }
    for(let x=0;x<W;x++){
      const band = Math.min(BANDS-1, Math.floor(x/bandW));
      const off = Math.round(bandOffset[band]);
      for(let y=0;y<H;y++){
        const sy = clampi(y - off, 0, H-1);
        writePixel(d, s, x, y, x, sy, rgbShift, W);
      }
    }
  } else if(mode === 'block'){
    for(let y=0;y<H;y++){
      for(let x=0;x<W;x++){
        writePixel(d, s, x, y, x, y, Math.round(rgbShift*0.5), W);
      }
    }
    const blockCount = Math.round(4 + energy*18);
    for(let i=0;i<blockCount;i++){
      const bw = 10 + Math.random()*90*energy;
      const bh = 6 + Math.random()*40*energy;
      const bx = Math.random()*W, by = Math.random()*H;
      for(let y=by; y<Math.min(H,by+bh); y++){
        for(let x=bx; x<Math.min(W,bx+bw); x++){
          const idx = (Math.floor(y)*W + Math.floor(x))*4;
          const v = Math.random()*255;
          d[idx] = v; d[idx+1] = v; d[idx+2] = v; d[idx+3] = 255;
        }
      }
    }
  } else { // flash
    const BANDS = bandOffset.length;
    const bandH = H / BANDS;
    for(let b=0;b<BANDS;b++){
      if(Math.random() < 0.5) bandTarget[b] = (Math.random()*2-1) * energy * 110;
      bandOffset[b] += (bandTarget[b] - bandOffset[b]) * 0.7;
    }
    for(let y=0;y<H;y++){
      const band = Math.min(BANDS-1, Math.floor(y/bandH));
      const off = Math.round(bandOffset[band]);
      for(let x=0;x<W;x++){
        const sx = clampi(x - off, 0, W-1);
        writePixel(d, s, x, y, sx, y, rgbShift, W);
      }
      if(Math.random() < energy * 0.02){
        for(let x=0;x<W;x++){
          const idx=(y*W+x)*4; const v = Math.random()<0.5?0:255;
          d[idx]=d[idx+1]=d[idx+2]=v; d[idx+3]=255;
        }
      }
    }
    if(Math.random() < energy*0.015){
      for(let i=0;i<d.length;i+=4){ d[i]=255-d[i]; d[i+1]=255-d[i+1]; d[i+2]=255-d[i+2]; }
    }
  }
 
  const grainAmt = energy * 40;
  for(let i=0;i<d.length;i+=4){
    if(Math.random() < energy*0.35){
      const n = (Math.random()*2-1) * grainAmt;
      d[i] = clampi(d[i]+n,0,255);
      d[i+1] = clampi(d[i+1]+n,0,255);
      d[i+2] = clampi(d[i+2]+n,0,255);
    }
  }
 
  ctx.putImageData(out, 0, 0);
  requestAnimationFrame(loop);
}
 
function clampi(v,lo,hi){ return v<lo?lo:(v>hi?hi:v); }
function writePixel(d, s, dx, dy, sx, sy, shift, w){
  const dIdx = (dy*w+dx)*4;
  const rX = clampi(sx-shift,0,w-1), bX = clampi(sx+shift,0,w-1);
  const rIdx=(sy*w+rX)*4, gIdx=(sy*w+sx)*4, bIdx=(sy*w+bX)*4;
  d[dIdx]=s[rIdx]; d[dIdx+1]=s[gIdx+1]; d[dIdx+2]=s[bIdx+2]; d[dIdx+3]=255;
}

let textRunId = 0;
 
const CORPUS_WORDS = POEMS.join(' ')
  .split(/\s+/)
  .map(w => w.replace(/[^\w'-]/g,''))
  .filter(w => w.length > 2);
 
function randomCorpusWord(){ return CORPUS_WORDS[rand(CORPUS_WORDS.length)]; }
 
async function triggerNewFragment(){
  const myRun = ++textRunId;
  const lines = linesOf(POEMS[currentPoemIndex]);
  const frag = lines[rand(lines.length)];
  termText.innerHTML = '<span class="cursor"></span>';
  await sleep(120);
  await typeFragment(frag, myRun);
}
 
async function typeChars(str, myRun, getShownPrefix, delayFn){
  let acc = "";
  for(let i=0;i<str.length;i++){
    if(myRun !== textRunId) return null;
    acc += str[i];
    termText.innerHTML = getShownPrefix() + acc + '<span class="cursor"></span>';
    await sleep(delayFn());
  }
  return acc;
}
 
async function typeFragment(frag, myRun){
  const pace = ['fast','slow','erratic'][rand(3)];
  const delayFn = () => {
    if(pace === 'fast') return 12 + Math.random()*18;
    if(pace === 'slow') return 90 + Math.random()*90;
    return 10 + Math.random()*160;
  };
 
  const words = frag.split(' ');
  let shown = "";
 
  for(let wi=0; wi<words.length; wi++){
    if(myRun !== textRunId) return;
    const word = words[wi];
 
    // occasional whole-word misfire + correction
    if(wi > 0 && Math.random() < 0.16){
      const decoy = randomCorpusWord();
      let decoyShown = "";
      for(let c=0;c<decoy.length;c++){
        if(myRun !== textRunId) return;
        decoyShown += decoy[c];
        termText.innerHTML = shown + '<span class="correction-char">' + decoyShown + '</span><span class="cursor"></span>';
        await sleep(delayFn());
      }
      await sleep(260 + Math.random()*220);
      if(myRun !== textRunId) return;
      // backspace the decoy
      for(let c=decoyShown.length; c>0; c--){
        if(myRun !== textRunId) return;
        termText.innerHTML = shown + '<span class="correction-char">' + decoyShown.slice(0,c-1) + '</span><span class="cursor"></span>';
        await sleep(16 + Math.random()*10);
      }
      await sleep(140);
    }
 
    // type the real word, char by char, with small chance of letter-level misfire
    for(let ci=0; ci<word.length; ci++){
      if(myRun !== textRunId) return;
      shown += word[ci];
      termText.innerHTML = shown + '<span class="cursor"></span>';
 
      if(/[a-z]/i.test(word[ci]) && Math.random() < 0.05){
        let glitch = "";
        const n = 2 + rand(3);
        for(let g=0; g<n; g++) glitch += GLITCH_CHARS[rand(GLITCH_CHARS.length)];
        termText.innerHTML = shown + '<span class="glitch-char">' + glitch + '</span>';
        await sleep(70 + Math.random()*90);
        if(myRun !== textRunId) return;
        termText.innerHTML = shown + '<span class="cursor"></span>';
        await sleep(60);
      } else if(Math.random() < 0.045){
        await sleep(450 + Math.random()*650);
        if(myRun !== textRunId) return;
      }
      await sleep(delayFn());
    }
    shown += (wi < words.length-1 ? ' ' : '');
    termText.innerHTML = shown + '<span class="cursor"></span>';
  }
}
 
currentPoemIndex = rand(POEMS.length);
triggerNewFragment();
</script>

<!-- Animated Favicon Script -->
<script>
(function() {
    // Find or create the favicon link tag
    let link = document.querySelector("link[rel~='icon']");
    if (!link) {
        link = document.createElement('link');
        link.rel = 'icon';
        document.head.appendChild(link);
    }

    let angle = 0;
    
    // Change the direction every 1000 milliseconds (1 second)
    setInterval(() => {
        // Draw an SVG arrow using your site's colors, rotated by the current angle
        const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
            <g transform="rotate(${angle} 12 12)">
                <path d="M12 2L20 10H15V22H9V10H4L12 2Z" fill="#CCFF00" stroke="#000000" stroke-width="2" stroke-linejoin="round"/>
            </g>
        </svg>`;
        
        // Encode the SVG and set it as the favicon
        link.href = 'data:image/svg+xml,' + encodeURIComponent(svg);
        
        // Rotate 90 degrees for the next frame (Up -> Right -> Down -> Left)
        angle = (angle + 90) % 360;
    }, 1000); // 1000ms = 1 second. Lower the number to speed it up!
})();
</script>
